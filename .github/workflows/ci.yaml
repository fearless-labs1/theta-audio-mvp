name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.38.5'
      FLUTTER_SDK: ${{ github.workspace }}/.flutter-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      SKIP_ANDROID: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Flutter/Android SDKs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_SDK }}
            ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ runner.os }}-sdks-v2-${{ env.FLUTTER_VERSION }}-${{ hashFiles('scripts/setup_flutter_android.sh') }}

      - name: Set up Flutter and Android tooling
        run: bash scripts/setup_flutter_android.sh

      - name: Expose Flutter and Android tools on PATH
        run: |
          echo "${FLUTTER_SDK}/bin" >> "$GITHUB_PATH"
          if [[ "${SKIP_ANDROID}" != "1" ]]; then
            echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          fi

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, android]
    env:
      FLUTTER_VERSION: '3.38.5'
      FLUTTER_SDK: ${{ github.workspace }}/.flutter-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      SKIP_ANDROID: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Android SDK installation for Android builds
        if: matrix.target == 'android'
        run: echo "SKIP_ANDROID=0" >> "$GITHUB_ENV"

      - name: Cache Flutter/Android SDKs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_SDK }}
            ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ runner.os }}-sdks-v2-${{ env.FLUTTER_VERSION }}-${{ hashFiles('scripts/setup_flutter_android.sh') }}

      - name: Set up Flutter and Android tooling
        run: bash scripts/setup_flutter_android.sh

      - name: Expose Flutter and Android tools on PATH
        run: |
          echo "${FLUTTER_SDK}/bin" >> "$GITHUB_PATH"
          if [[ "${SKIP_ANDROID}" != "1" ]]; then
            echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          fi

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop support
        if: matrix.target == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Build release binaries
        run: |
          if [[ "${{ matrix.target }}" == "linux" ]]; then
            flutter build linux --release
          else
            flutter build appbundle --release
          fi

      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: build/linux/x64/release/bundle/

      - name: Upload Android artifacts
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-appbundle
          path: build/app/outputs/bundle/release/app-release.aab

  windows:
    name: Windows build
    runs-on: windows-latest
    env:
      FLUTTER_VERSION: '3.38.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (Windows)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/

  apple:
    name: Apple builds (macOS + iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: macos-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            macos-pub-

      - name: Install dependencies
        run: flutter pub get
        shell: bash

      - name: Install CocoaPods (iOS)
        run: |
          sudo gem install cocoapods -N
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install --repo-update
            cd ..
          else
            echo "No ios/Podfile found — skipping CocoaPods."
          fi
        shell: bash

      - name: Build macOS (release)
        run: flutter build macos --release
        shell: bash

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign
        shell: bash

      - name: Upload iOS build output (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-unsigned
          path: build/ios/iphoneos/
